name: 'Post release note til Slack'
permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  notifyReleaseNote:
    name: "Poster release note til Slack"
    if: |
      (github.event.pull_request.merged && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: |
          if [ -n "$PR_NR" ]; then
            MESSAGE="$MESSAGE (<${URL}|#${PR_NR}>)"
          else
            MESSAGE="$MESSAGE (<${URL}|commit>)"
          fi

          MESSAGE=$(echo "$MESSAGE" | sed -r 's/"/\\\"/g')

          PAYLOAD="payload={ \"attachments\": [{ \"text\": \"*Ny versjon av ufore-varsler på vei ut* :trygdebeistet:\n\${MESSAGE}\n\nAnsvarlig: \${slack_id}\" }] }"
          chmod +x "${GITHUB_WORKSPACE}/.github/notify-slack.sh"
          "${GITHUB_WORKSPACE}/.github/notify-slack.sh" "${SSH_KEY}" "${USER}" "${PAYLOAD}" "${WEBHOOK_URL}"

        env:
          SSH_KEY: ${{ secrets.SSH_KEY_NOTIFY_TO_SLACK }}
          USER: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || github.event.head_commit.author.username }}
          MESSAGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
          URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || github.event.head_commit.url }}
          PR_NR: ${{ github.event.pull_request.number || '' }}
          WEBHOOK_URL: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
