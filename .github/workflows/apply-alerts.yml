name: Apply alerts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-alerts.yml'
      - 'alerts/**'

jobs:
  apply-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nais/deploy/actions/deploy@3944168fd20b7eea3818e97de3810f74b54c78ff
        env:
          CLUSTER: prod-gcp
          RESOURCE: alerts/alerts.yaml
