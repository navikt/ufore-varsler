name: Automerge Dependabot PRer

on:
  schedule:
    - cron: '0 8-16 * * 1-5'
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: read
      contents: write
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app-token
        with:
          app-id: ${{ vars.TEAM_UFORE_APP_ID }}
          private-key: ${{ secrets.TEAM_UFORE_PRIVATE_KEY }}
      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@70455df4433fac78f20d5a248f9ebf07ccac11fe
        with:
          token: ${{ steps.app-token.outputs.token }}
          blackout-periods: 'Sat,Sun,Dec 24-Jan 2'
          semver-filter: 'patch,minor'
