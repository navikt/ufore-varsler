apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: ufore-varsler-statistikk-jobb
  namespace: ufore
  labels:
    team: ufore
spec:
  image: "{{ image }}"
  schedule: "0 7 * * *"
  timeZone: Europe/Oslo
  backoffLimit: 1
  concurrencyPolicy: Forbid
  ttlSecondsAfterFinished: 300
  observability:
    logging:
      destinations:
        - id: loki
  gcp:
    permissions:
      - resource:
          apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
          kind: Project
        role: roles/cloudsql.client
    bigQueryDatasets:
      - cascadingDelete: true # TODO sjekke dette - tror egentlig vi ikke skal ha det siden dette bare er statiskk.
        description: Statistikk for ufore-varsler
      - name: ufore_varsler_statistikk
        permission: READWRITE

  envFrom:
    - secret: google-sql-ufore-varsler-ufore-varsler-ufore-varsler-s-b6657f5a

  env:
    - name: SPRING_PROFILES_ACTIVE
      value: statistikk-jobb,dev
    - name: LOGGING_CONFIG
      value: classpath:logback-json.xml
    - name: CLOUDSQL_INSTANCE
      value: ufore-dev-dfc9:europe-north1:ufore-varsler