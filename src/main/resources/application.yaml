spring:
  application:
    name: ufore-varsler
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  datasource:
    url: ${DB_JDBC_URL}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    client-id: ${spring.application.name}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_PATH:}
      ssl.truststore.password: ${KAFKA_CREDSTORE_PASSWORD:}
      ssl.keystore.location: ${KAFKA_KEYSTORE_PATH:}
      ssl.keystore.password: ${KAFKA_CREDSTORE_PASSWORD:}
      ssl.key.password: ${KAFKA_CREDSTORE_PASSWORD:}

app:
  unleash:
    url: ${UNLEASH_SERVER_API_URL}/api
    token: ${UNLEASH_SERVER_API_TOKEN}
  texas:
    token-introspection-endpoint: ${NAIS_TOKEN_INTROSPECTION_ENDPOINT}
  kafka:
    min-side:
      varsel-hendelse: min-side.aapen-varsel-hendelse-v1
      consumer-group-id: ufore-varsler-varsel-hendelse-consumer
      brukervarsel: min-side.aapen-brukervarsel-v1
    ufore-varsler:
      topic: ufore.varsler
      consumer-group-id: ufore-varsler-consumer
  dine-muligheter-url: https://nav.no/uforetrygd/selvbetjening/dine-muligheter

management:
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, gateway
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99